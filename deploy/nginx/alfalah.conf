# ========================================================
# NGINX PRODUCTION REVERSE PROXY CONFIGURATION
# Alfalah Community Support Centre (Charity #1150221)
# ========================================================
# Replace 'YOUR_DOMAIN.COM' with your actual registered domain
# (e.g. alfalahcommunity.org.uk or alfalahcsc.com)
#
# Installation:
# 1. Copy to VPS: sudo cp deploy/nginx/alfalah.conf /etc/nginx/sites-available/alfalah
# 2. Enable site: sudo ln -s /etc/nginx/sites-available/alfalah /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload:      sudo systemctl reload nginx
# 5. Enable SSL:  sudo certbot --nginx -d YOUR_DOMAIN.COM -d www.YOUR_DOMAIN.COM
# ========================================================

# Upstream definitions
upstream alfalah_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream alfalah_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # Maximum file upload size (for CMS photo & document uploads)
    client_max_body_size 20M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API Routes
    location /api/ {
        proxy_pass http://alfalah_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Uploaded Media Assets (Direct from backend storage)
    location /uploads/ {
        proxy_pass http://alfalah_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://alfalah_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend Application (All other pages)
    location / {
        proxy_pass http://alfalah_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
