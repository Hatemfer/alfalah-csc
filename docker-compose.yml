services:
  db:
    image: mysql:8.4
    container_name: alfalah-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-alfalah_db}
      MYSQL_USER: ${DB_USERNAME:-alfalah_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-alfalah_dev_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alfalah-backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-alfalah_user}
      DB_PASSWORD: ${DB_PASSWORD:-alfalah_dev_2026}
      DB_NAME: ${DB_NAME:-alfalah_db}
      JWT_SECRET: ${JWT_SECRET:-change_in_production}
    volumes:
      - media_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alfalah-frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    depends_on:
      - backend

volumes:
  db_data:
  media_uploads:
