<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Modern Emerald & Teal Gradients (Crisp & Luminous) -->
    <linearGradient id="emeraldLuminous" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Warm Polished Gold Gradients -->
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0c4a6e" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Protective Halo / Shadow -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" filter="url(#logoShadow)" />

  <!-- Outer Luminous Emerald Roundel -->
  <circle cx="100" cy="100" r="88" fill="url(#emeraldLuminous)" />

  <!-- Subtle Radial Inner Glow -->
  <circle cx="100" cy="100" r="88" fill="url(#sunGlow)" />

  <!-- Outer Gold Accent Ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldLuxe)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="81" fill="none" stroke="#fef08a" stroke-width="0.75" stroke-opacity="0.7" />

  <!-- Geometric 12-point beaded circle -->
  <circle cx="100" cy="100" r="77" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="2,5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- INNER EMBLEM: Iconic Modern Mosque Architecture & Quran -->
  <g transform="translate(0, 0)">
    <!-- Central Islamic Arch (Mihrab) Outline -->
    <path
      d="M 58 140 
         L 58 92 
         C 58 64, 78 50, 100 36 
         C 122 50, 142 64, 142 92 
         L 142 140 
         Z"
      fill="rgba(255, 255, 255, 0.12)"
      stroke="url(#goldLuxe)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Inner Arch Inset -->
    <path
      d="M 64 138 
         L 64 94 
         C 64 70, 82 58, 100 46 
         C 118 58, 136 70, 136 94 
         L 136 138 
         Z"
      fill="rgba(4, 120, 87, 0.45)"
      stroke="#fde68a"
      stroke-width="0.75"
      stroke-opacity="0.6"
    />

    <!-- Mosque Dome Silhouette -->
    <path
      d="M 76 112 
         C 76 96, 88 84, 100 78 
         C 112 84, 124 96, 124 112 
         Z"
      fill="#ffffff"
      stroke="url(#goldLuxe)"
      stroke-width="1.2"
    />

    <!-- Dome Finial (Spire & Crescent) -->
    <line x1="100" y1="78" x2="100" y2="66" stroke="url(#goldLuxe)" stroke-width="1.8" stroke-linecap="round" />
    <path
      d="M 98 64 
         C 95 64, 93 61, 95 58 
         C 97 55, 101 54, 104 56 
         C 101 56, 98 58, 98 60 
         C 98 62, 100 64, 98 64 
         Z"
      fill="url(#goldLuxe)"
    />

    <!-- Left Minaret -->
    <path
      d="M 48 138 
         L 48 82 
         L 53 82 
         L 53 138 
         Z"
      fill="#ffffff"
      opacity="0.95"
    />
    <!-- Left Minaret Dome & Finial -->
    <path d="M 47 82 C 47 75, 50.5 70, 50.5 67 C 50.5 70, 54 75, 54 82 Z" fill="url(#goldLuxe)" />
    <line x1="50.5" y1="67" x2="50.5" y2="62" stroke="url(#goldLuxe)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="50.5" cy="61" r="1.2" fill="#fef08a" />

    <!-- Right Minaret -->
    <path
      d="M 147 138 
         L 147 82 
         L 152 82 
         L 152 138 
         Z"
      fill="#ffffff"
      opacity="0.95"
    />
    <!-- Right Minaret Dome & Finial -->
    <path d="M 146 82 C 146 75, 149.5 70, 149.5 67 C 149.5 70, 153 75, 153 82 Z" fill="url(#goldLuxe)" />
    <line x1="149.5" y1="67" x2="149.5" y2="62" stroke="url(#goldLuxe)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="149.5" cy="61" r="1.2" fill="#fef08a" />

    <!-- Radiant 8-Pointed Star of Guidance (Rub el Hizb) Top Center -->
    <g transform="translate(100, 36) scale(0.9)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#goldLuxe)" />
      <polygon points="-5,-5 0,-3 5,-5 3,0 5,5 0,3 -5,5 -3,0" fill="#fef08a" opacity="0.85" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>

    <!-- Open Book of Knowledge / Quran at Base (Education & Guidance) -->
    <g transform="translate(100, 126)">
      <!-- Left Page -->
      <path
        d="M -1 0 
           C -8 -4, -18 -4, -26 -1 
           L -26 12 
           C -18 9, -8 9, -1 13 
           Z"
        fill="#ffffff"
        stroke="url(#goldLuxe)"
        stroke-width="1.2"
      />
      <!-- Right Page -->
      <path
        d="M 1 0 
           C 8 -4, 18 -4, 26 -1 
           L 26 12 
           C 18 9, 8 9, 1 13 
           Z"
        fill="#ffffff"
        stroke="url(#goldLuxe)"
        stroke-width="1.2"
      />
      <!-- Book Stand (Rehal) Base -->
      <path
        d="M -16 15 
           L -4 21 
           L 0 18 
           L 4 21 
           L 16 15 
           L 12 24 
           L -12 24 
           Z"
        fill="url(#goldLuxe)"
      />
      <circle cx="0" cy="10" r="1.5" fill="#d97706" />
    </g>
  </g>

  <!-- Bottom Arch Inscription: ALFALAH (Clean Arabic Script / Text) -->
  <path
    d="M 50 152 Q 100 166 150 152"
    fill="none"
    stroke="url(#goldLuxe)"
    stroke-width="1"
    stroke-opacity="0.8"
  />

  <text
    x="100"
    y="168"
    text-anchor="middle"
    fill="#ffffff"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="8.5"
    font-weight="800"
    letter-spacing="1.5"
  >
    ALFALAH
  </text>

  <text
    x="100"
    y="178"
    text-anchor="middle"
    fill="#fef08a"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="5.5"
    font-weight="700"
    letter-spacing="0.8"
  >
    BIRMINGHAM • #1150221
  </text>
</svg>
